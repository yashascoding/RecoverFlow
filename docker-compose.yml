services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: recoverflow
      POSTGRES_PASSWORD: recoverflow123
      POSTGRES_DB: recoverflow
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - recoverflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recoverflow -d recoverflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    networks:
      - recoverflow
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8001:8000"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=recoverflow
      - POSTGRES_PASSWORD=recoverflow123
      - POSTGRES_DB=recoverflow
      - REDIS_HOST=redis
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_WEBHOOK_SECRET=${RESEND_WEBHOOK_SECRET}
      - RECOVERY_EMAIL_FROM=${RECOVERY_EMAIL_FROM:-onboarding@resend.dev}
      - TEST_EMAIL=${TEST_EMAIL}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-secret-key}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - recoverflow
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "3001:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - recoverflow
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build: ./backend
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=recoverflow
      - POSTGRES_PASSWORD=recoverflow123
      - POSTGRES_DB=recoverflow
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RECOVERY_EMAIL_FROM=${RECOVERY_EMAIL_FROM:-onboarding@resend.dev}
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - recoverflow
    command: python -m app.workers.event_worker
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import redis.asyncio as r; print(\"ok\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  recoverflow:
    driver: bridge

volumes:
  postgres_data:
