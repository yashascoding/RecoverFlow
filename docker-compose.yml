services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: recoverflow
      POSTGRES_PASSWORD: recoverflow123
      POSTGRES_DB: recoverflow_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recoverflow -d recoverflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5
     
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli","ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=recoverflow
      - POSTGRES_PASSWORD=recoverflow123
      - POSTGRES_DB=recoverflow_db
      - REDIS_HOST=redis
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
